# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

## remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix M-f
bind-key M-f send-prefix
#
## split panes using | and -
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# theme colors
set -g @accent "blue"        # highlight (current window, mode, messages)
set -g @fg "white"           # text on the accent
set -g @dim "colour244"      # muted text on the transparent bar
set -g @session_bg "colour25" # darker blue behind the session name

# clock mode
setw -g clock-mode-colour blue

# copy mode
setw -g mode-style 'fg=#{@fg} bg=#{@accent} bold'

# panes
set -g pane-border-style 'fg=#{@dim}'
set -g pane-active-border-style 'fg=#{@accent}'

# statusbar — transparent bar, dim text, blue only for the active window
# set -g status-position bottom
# set -g status-justify left
set -g status-style 'fg=#{@dim} bg=default'

set -g status-left ''
# set -g status-left-length 10

# session name on the right: white on darker blue
set -g status-right-style 'fg=#{@fg} bg=#{@session_bg} bold'
set -g status-right ' #S '
# set -g status-right-length 50

# separate windows with a pipe
setw -g window-status-separator '|'

# current window: highlighted blue pill
setw -g window-status-current-style 'fg=#{@fg} bg=#{@accent} bold'
setw -g window-status-current-format '#{p20: #{window_index} #{window_name} #{window_flags} }'

# other windows: accent-blue text, transparent
setw -g window-status-style 'fg=#{@accent} bg=default'
setw -g window-status-format '#{p20: #{window_index} #{window_name} #{window_flags} }'

setw -g window-status-bell-style 'fg=#{@accent} bg=default bold'

# messages
set -g message-style 'fg=#{@fg} bg=#{@accent} bold'

# Base window and pane index to 1
set -g base-index 1
setw -g pane-base-index 1


set -g focus-events on
set -g status-left-length 99
set -g status-right-length 99
set -g status-justify left

bind-key -n M-S-Left run-shell 'target=$((#{window_index}-1)); tmux swap-window -d -t "$target" 2>/dev/null || tmux move-window -t "$target"'
bind-key -n M-S-Right run-shell 'target=$((#{window_index}+1)); tmux swap-window -d -t "$target" 2>/dev/null || tmux move-window -t "$target"'

bind-key "j" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
